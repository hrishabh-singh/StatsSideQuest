<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatsSideQuest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gate-container">
    <form id="gate-form" class="gate-card" autocomplete="off">
      <h1>🔒 Locked</h1>
      <p>Enter the password to continue.</p>
      <input type="password" id="password-input" placeholder="Password" autofocus>
      <button type="submit">Enter</button>
      <p id="error-message" class="error" hidden>Incorrect password. Try again.</p>
    </form>
  </div>
  <script src="gate.js"></script>
</body>
</html>
